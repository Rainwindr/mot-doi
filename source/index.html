   a tab bar whose centre is a big yellow "+1" stamp. Sheets slide up from the bottom. */
:root{
  --bg:#e7eeed; --surface:#ffffff; --surface-2:#f2f6f5; --ink:#13222a; --muted:#56686e; --line:#d1dcdb;
  --brand:#0c5a60; --brand-ink:#ffffff; --accent:#f3b70a; --accent-ink:#1d1600;
  --good:#2b9656; --warn:#c98d00; --bad:#cf3f3f; --shade:rgba(10,30,34,.45);
  --shadow:0 12px 32px rgba(12,40,46,.18);
  --f-display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1315; --surface:#142023; --surface-2:#1a292d; --ink:#e4eeed; --muted:#92a5a8; --line:#26383c;
    --brand:#5bc3c4; --brand-ink:#042220; --accent:#f6c533; --accent-ink:#1d1600;
    --good:#4cc27c; --warn:#f0b429; --bad:#f06b6b; --shade:rgba(0,0,0,.6);
    --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1315; --surface:#142023; --surface-2:#1a292d; --ink:#e4eeed; --muted:#92a5a8; --line:#26383c;
  --brand:#5bc3c4; --brand-ink:#042220; --accent:#f6c533; --accent-ink:#1d1600;
  --good:#4cc27c; --warn:#f0b429; --bad:#f06b6b; --shade:rgba(0,0,0,.6);
  --shadow:0 12px 32px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#root{height:100%;display:flex;justify-content:center}
.app{width:100%;max-width:540px;height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.muted{color:var(--muted)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--surface-2);border:1px solid var(--line)}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.btn.accent{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.small{padding:7px 11px;font-size:13px;border-radius:9px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip.code{font-family:var(--f-num);letter-spacing:.04em}

/* topbar */
.top{display:flex;align-items:center;gap:10px;padding-block:12px 10px;border-bottom:1px solid var(--line)}
.top .who{flex:1;min-width:0}
.top .name{font-family:var(--f-display);font-weight:800;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.cash{text-align:right}
.cash b{display:block;font-family:var(--f-num);font-size:17px}
.cash span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 9px;font-size:12px;font-weight:700}

/* ledger */
.log{flex:1;overflow-y:auto;padding-block:14px;display:flex;flex-direction:column;gap:10px;min-height:0}
.year{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start}
.year .age{font-family:var(--f-display);font-weight:800;font-size:22px;line-height:1;color:var(--brand);text-align:right;padding-top:2px}
.year .age small{display:block;font-family:var(--f-body);font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.year ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px;min-width:0}
.year li{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font-size:14px}
.year.last li{border-color:color-mix(in srgb,var(--brand) 35%,var(--line))}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;padding-block:10px;border-top:1px solid var(--line)}
.stat{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:12px;font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .4s ease}
.stat .num{font-size:12px;min-width:2ch;text-align:right}

/* tab bar */
.tabs{display:grid;grid-template-columns:1fr 1fr auto 1fr 1fr;align-items:end;gap:6px;
  padding-block:8px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.tab{background:none;border:0;padding:6px 2px;font-size:12px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:10px}
.tab:hover{color:var(--ink);background:var(--surface-2)}
.tab svg{width:22px;height:22px}
.age-btn{width:78px;height:78px;margin-top:-30px;border-radius:50%;border:4px solid var(--bg);background:var(--accent);color:var(--accent-ink);
  font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .12s}
.age-btn small{font-family:var(--f-body);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
.age-btn:active{transform:scale(.94)}

/* sheets and modals */
.shade{position:fixed;inset:0;background:var(--shade);display:flex;justify-content:center;z-index:20}
.sheet{align-items:flex-end}
.sheet .panel{width:100%;max-width:540px;max-height:86%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:var(--shadow)}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.panel-head h2{font-size:22px}
.sec{margin-block:16px 8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:700}
.item .s{font-size:12.5px;color:var(--muted)}
button.item{text-align:left;width:100%}
button.item:hover{border-color:var(--brand)}
.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.act{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.act:hover:not(:disabled){border-color:var(--brand)}
.act b{font-size:14px}
.act span{font-size:12px;color:var(--muted)}
.act:disabled{opacity:.45;cursor:not-allowed}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.kpi span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.kpi b{display:block;font-family:var(--f-num);font-size:16px;margin-top:2px}
.up{color:var(--good)} .down{color:var(--bad)}
.modal{align-items:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.modal .box{width:100%;max-width:440px;background:var(--surface);border-radius:20px;padding:20px;box-shadow:var(--shadow);border:1px solid var(--line);max-height:90%;overflow-y:auto}
.modal .tag{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--brand)}
.modal p{font-size:16px;margin:8px 0 16px}
.modal .choices{display:flex;flex-direction:column;gap:8px}
.modal .choices .btn{text-align:left}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(110px + env(safe-area-inset-bottom,0px));z-index:40;max-width:min(440px,calc(100% - 32px));
  background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;box-shadow:var(--shadow)}

/* title, create, birth card, death */
.screen{flex:1;overflow-y:auto;padding-block:20px 32px;display:flex;flex-direction:column;gap:16px}
.hero{padding-block:28px 8px}
.hero .kicker{font-family:var(--f-num);font-size:12px;color:var(--brand);letter-spacing:.08em}
.hero h1{font-size:clamp(46px,14vw,72px);font-weight:800;line-height:.95;letter-spacing:-.02em;margin-top:8px}
.hero p{max-width:34ch;font-size:16px;color:var(--muted);margin:12px 0 0}
.counter{font-family:var(--f-num);font-size:13px;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:9px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:700;color:var(--muted)}
.field input[type=text],.field select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.slider{display:grid;grid-template-columns:96px 1fr 3ch;gap:10px;align-items:center;font-size:13px;font-weight:600}
.slider input{width:100%;accent-color:var(--brand)}
.traits{display:flex;flex-wrap:wrap;gap:6px}
.traits label{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:13px;cursor:pointer}
.traits input{accent-color:var(--brand)}
.birth{text-align:center}
.birth .big{font-family:var(--f-display);font-size:32px;font-weight:800;line-height:1.05;margin:6px 0}
.birth .odds{font-family:var(--f-num);color:var(--brand);font-size:13px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left;margin:14px 0}
.facts div{background:var(--surface-2);border-radius:10px;padding:8px 10px;font-size:13px}
.facts span{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:700}
.stone{text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:120px 120px 16px 16px;padding:40px 20px 22px}
.stone h2{font-size:28px}
.ribbon{display:inline-block;margin-top:12px;padding:6px 16px;background:var(--accent);color:var(--accent-ink);font-weight:800;border-radius:6px;font-family:var(--f-display);font-size:18px}
table.cmp{width:100%;border-collapse:collapse;font-size:13px}
table.cmp th,table.cmp td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
table.cmp th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
table.cmp tr.me td{font-weight:700;color:var(--brand)}
.tablewrap{overflow-x:auto}
.gate p{font-size:15px}
@media (max-width:380px){.form{grid-template-columns:1fr}.stats{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- state ---------- */
let S=null;                 // saved game: {p, econ, twins, queue}

const P=()=>S.p;
const F=()=>cf(S.p.country);
function cf(code){return clamp(Math.pow(CTRY[code].gdp/82000,.55),.06,1)}
const hasT=t=>S.p.traits.includes(t);
function add(k,d){const p=P();p.st[k]=clamp(Math.round(p.st[k]+d),0,100)}
function karma(d){P().karma=clamp(P().karma+d,0,100)}
function log(line){const p=P();p.log[p.log.length-1].lines.push(line)}
function save(){if(S)store.set(KEY,JSON.stringify(S))}
function partner(){return P().people.find(x=>(x.role==='partner'||x.role==='spouse')&&x.alive)}
function kids(){return P().people.filter(x=>x.role==='child'&&x.alive)}
function parents(){return P().people.filter(x=>(x.role==='mother'||x.role==='father')&&x.alive)}
function invested(p){return Object.values(p.inv).reduce((s,v)=>s+v,0)}
function netWorth(p){return p.money+invested(p)+p.houses.reduce((s,h)=>s+h.value,0)+(p.biz?p.biz.value:0)-p.debt}
function fullName(p){return p.first+' '+p.last}
function wantG(p){return p.orient==='straight'?(p.g==='m'?'f':'m'):p.orient==='gay'?p.g:(R()<.5?'m':'f')}
function npc(role,g,age,code){const c=CTRY[code||P().country];const pool=NAMES[c.pool];return{id:uid(),role,g,name:pick(g==='m'?pool.m:pool.f)+' '+pick(pool.l),age,rel:rint(45,75),alive:true,looks:clamp(Math.round(50+gauss()*22),5,100)}}

/* ---------- creating a life ---------- */
function tierFor(f){const w=f<.15?[.55,.35,.08,.02]:f<.4?[.3,.45,.2,.05]:[.15,.5,.28,.07];return wpick([0,1,2,3],i=>w[i])}
function makePerson(o){
  const c=CTRY[o.country],pool=NAMES[c.pool],f=cf(o.country);
  const base=()=>clamp(Math.round(50+gauss()*18),5,100);
  const p={first:o.first||pick(o.g==='m'?pool.m:pool.f),last:o.last||pick(pool.l),g:o.g,orient:o.orient,country:o.country,age:o.age||0,alive:true,
    st:o.st?{...o.st}:{health:clamp(base()+12,5,100),happy:base(),smarts:base(),looks:base()},karma:o.karma??50,traits:o.traits||[],tier:o.tier,
    money:o.money||0,debt:0,edu:{stage:'none',degree:0,yrs:0,tuition:0},job:null,retired:false,pension:0,income:0,
    people:[],prison:0,prisonTotal:0,escapes:0,wanted:false,addict:false,addPts:0,
    inv:{savings:0,index:0,nova:0,green:0,lumi:0,port:0,gold:0,meme:0},lastRet:{},houses:[],biz:null,bizSold:0,
    log:[{age:o.age||0,lines:[]}],used:{},seen:{},cnt:{club:0,casino:0,crime:0,acts:0,partners:0,kids:0,drink:0},cheated:false,
    custom:!!o.custom,gen:o.gen||1,cause:null,listings:null,houseOffers:null,tmp:{}};
  if(!o.st) for(const t of p.traits){const s=TRAITS[t].s;if(s)p.st[s[0]]=clamp(p.st[s[0]]+s[1],0,100)}
  return p;
}
function makeFamily(p){
  const c=CTRY[p.country],pool=NAMES[c.pool],f=cf(p.country);
  const pm=[.25,1,3.5,18][p.tier]*40000*f;
  const mk=(role,g,age,extra)=>({id:uid(),role,g,name:pick(g==='m'?pool.m:pool.f)+' '+p.last,age,rel:rint(55,90),alive:true,...extra});
  p.people.push(mk('mother','f',rint(19,38),{money:pm/2,job:pick(TIER_JOBS[p.tier])}));
  p.people.push(mk('father','m',rint(20,42),{money:pm/2,job:pick(TIER_JOBS[p.tier])}));
  const ns=rint(0,f<.2?3:2);for(let i=0;i<ns;i++)p.people.push(mk('sibling',R()<.5?'m':'f',rint(1,12)));
}
function makeTwins(){
  const codes=Object.keys(CTRY);const out=[];
  for(let i=0;i<4;i++){
    const code=wpick(codes,k=>CTRY[k].b),c=CTRY[code],g=R()<.5?'m':'f',pool=NAMES[c.pool],f=cf(code);
    const infant=R()<(90-c.le)*.004;
    const death=infant?rint(0,4):clamp(Math.round(c.le+gauss()*11),6,104);
    const tier=tierFor(f);
    const job=death<18?null:pick(Object.keys(JOBS).filter(k=>JOBS[k].deg<=(tier>=2?4:tier===1?2:0)));
    out.push({name:pick(g==='m'?pool.m:pool.f)+' '+pick(pool.l),code,g,death,tier,job});
  }
  return out;
}
function startLife(o){
  const p=makePerson(o);makeFamily(p);
  S={p,econ:{phase:'boom',left:rint(2,5),ret:{}},twins:makeTwins(),queue:[]};
  econStep(true);
  const c=CTRY[p.country],mom=p.people[0],dad=p.people[1];
  log(L(`Bạn chào đời là ${p.g==='m'?'một bé trai':'một bé gái'} tại ${c.vi}.`,`You were born a ${p.g==='m'?'boy':'girl'} in ${c.en}.`));
  log(L(`Gia đình bạn thuộc nhóm ${TIERS[p.tier][0].toLowerCase()}. Mẹ là ${mom.name} (${mom.job[0].toLowerCase()}), bố là ${dad.name} (${dad.job[0].toLowerCase()}).`,
        `Your family is ${TIERS[p.tier][1].toLowerCase()}. Mom is ${mom.name} (${mom.job[1].toLowerCase()}), dad is ${dad.name} (${dad.job[1].toLowerCase()}).`));
  log(L('Cùng giây đó, thêm 4 em bé khác chào đời ở những nơi khác trên thế giới.','In that same second, four other babies were born elsewhere in the world.'));
  U.screen='game';U.sheet=null;save();render();showBirthCard();
}

/* ---------- yearly simulation ---------- */
function econStep(silent){
  const e=S.econ;
  if(!silent){e.left--;if(e.left<=0){
    if(e.phase==='boom'){e.phase='peak';e.left=rint(1,2)}
    else if(e.phase==='peak'){if(R()<.3){e.phase='crisis';e.left=1}else{e.phase='recession';e.left=rint(1,2)}}
    else{e.phase='boom';e.left=rint(3,7)}
    log(L(`Kinh tế thế giới bước vào giai đoạn: ${PH[e.phase].n[0].toLowerCase()}.`,`The world economy enters a ${PH[e.phase].n[1].toLowerCase()} phase.`));
  }}
  const m=PH[e.phase].r,ret={savings:Math.min(CTRY[S.p.country].rate,.08)};
  for(const a of ASSETS){if(a.id==='savings')continue;let r=a.mu+a.beta*m+a.sd*gauss();
    if(a.id==='meme'){if(R()<.08)r=-.8+R()*.1;else if(R()<.05)r=2+R()*5}
    ret[a.id]=clamp(r,-.95,8)}
  ret.house=.02+.4*m+.05*gauss();e.ret=ret;
}
function hazard(age,le,health,addict){
  if(age<=5)return(90-le)*.0013*(age<=1?1:.4)*(1.6-health/100);
  return Math.min(.9,.00004*Math.exp(.088*(age+(79-le)))*(1.6-health/100)*(addict?1.6:1));
}
function eduStep(){
  const p=P(),e=p.edu,f=F();
  if(p.prison>0)return;
  if(p.age===6&&e.stage==='none'){
    const prob=.72+.26*f+.04*p.tier;
    if(R()<prob){e.stage='school';log(L('Bạn bắt đầu đi học tiểu học.','You start primary school.'))}
    else{e.noSchool=true;log(L('Gia đình không đủ điều kiện cho bạn đi học.','Your family cannot afford to send you to school.'))}
  }
  if(e.stage==='school'){
    add('smarts',rint(0,3));
    if(p.age>=11&&p.age<=15&&p.tier===0&&f<.3&&R()<.05&&!p.seen.dropout)S.queue.push('dropout');
    if(p.age>=18){e.stage='done';e.degree=1;log(L('Bạn tốt nghiệp phổ thông.','You graduate from high school.'));S.queue.push('after_hs')}
  } else if(e.stage==='uni'||e.stage==='trade'||e.stage==='grad'){
    add('smarts',rint(1,4));e.yrs--;
    if(e.tuition>0){p.money-=e.tuition}
    if(e.yrs<=0){
      const d=e.stage==='trade'?2:e.stage==='uni'?3:4;e.degree=d;e.stage='done';e.tuition=0;
      log(L(`Bạn nhận bằng ${DEG[d][0].toLowerCase()}.`,`You earn your ${DEG[d][1].toLowerCase()} degree.`));
      if(d===3&&p.st.smarts>=60)S.queue.push('after_uni');
    }
  }
}
function jobStep(){
  const p=P(),f=F();p.income=0;
  if(p.job&&!p.prison){
    const j=JOBS[p.job.id],sal=Math.round(j.base*f*(1+.12*p.job.level));
    p.income=sal;p.money+=sal*.75;p.job.yrs++;
    p.job.perf=clamp(Math.round(p.job.perf+rint(-8,7)+(p.used.work?6:0)+(p.st.smarts-50)/25),0,100);
    if(p.job.perf>78&&R()<.45&&p.job.level<6){p.job.level++;log(L(`Bạn được thăng chức lên ${RANKS[p.job.level][0]} ${j.n[0].toLowerCase()}.`,`You are promoted to ${RANKS[p.job.level][1]} ${j.n[1]}.`))}
    else if(p.job.perf<15&&R()<.5){log(L(`Bạn bị đuổi việc ${j.n[0].toLowerCase()} vì làm việc kém.`,`You are fired from your ${j.n[1]} job for poor performance.`));p.job=null;add('happy',-10)}
    else if(S.econ.phase==='crisis'&&R()<.2){log(L('Công ty cắt giảm nhân sự vì khủng hoảng. Bạn mất việc.','Your company lays people off in the crisis. You lose your job.'));p.job=null;add('happy',-12)}
  }
  if(p.retired&&p.pension)p.money+=p.pension;
}
function financeStep(){
  const p=P(),f=F(),e=S.econ;
  for(const a of ASSETS){const r=e.ret[a.id];p.lastRet[a.id]=r;if(p.inv[a.id]>0)p.inv[a.id]*=1+r}
  for(const h of p.houses){h.value*=1+e.ret.house+.03*gauss();p.money+=(h.rented?h.value*.045:0)-h.value*.01}
  if(p.age>=18&&!p.prison){
    const home=p.age<=24&&!p.job&&parents().length>0;
    let cost=(home?3500:11000)*f+.08*p.income+(p.money>1e6?p.money*.01:0);
    p.money-=cost;
  }
  if(p.debt>0){p.debt*=1.07;const pay=Math.min(Math.max(p.money,0)*.5,p.debt);p.money-=pay;p.debt-=pay;if(p.debt<1)p.debt=0}
  if(p.money<0){p.debt+=-p.money;p.money=0;log(L(`Bạn tiêu quá tay. Nợ hiện tại: ${money(p.debt)}.`,`You overspent. Current debt: ${money(p.debt)}.`))}
}
function bizStep(){
  const p=P(),b=p.biz;if(!b)return;
  const t=BIZ[b.type],f=F();
  let rate=t.mean+PH[S.econ.phase].r*.5+t.sd*gauss()+(p.st.smarts-50)/400+(hasT('hustler')?.05:0)+(b.mkt?.07:0)-(p.prison?.15:0);
  if(b.type==='tech'&&R()<.04)rate+=2.5;
  let profit=b.value*rate*.5;if(b.evade&&profit>0)profit*=1.2;
  p.money+=profit;b.value*=1+rate*.6;b.yrs++;b.mkt=false;b.last=profit;
  log(profit>=0?L(`${b.name} lãi ${money(profit)} năm nay.`,`${b.name} made a ${money(profit)} profit this year.`):L(`${b.name} lỗ ${money(-profit)} năm nay.`,`${b.name} lost ${money(-profit)} this year.`));
  if(b.value<t.cap*f*.15){log(L(`${b.name} phá sản và đóng cửa.`,`${b.name} goes bankrupt and closes.`));p.biz=null;add('happy',-15);return}
  if(b.evade&&R()<.12)S.queue.push('tax_audit');
  if(b.type==='tech'&&!b.ipo&&b.value>3e6*f&&R()<.3)S.queue.push('ipo');
}
function prisonStep(){
  const p=P();
  if(p.prison>0){p.prison--;p.prisonTotal++;add('happy',-6);add('health',-2);
    log(p.prison===0?L('Bạn mãn hạn tù và được thả.','You finish your sentence and walk free.'):L(`Bạn vẫn đang ngồi tù. Còn ${p.prison} năm.`,`You are still in prison. ${p.prison} years left.`))}
  else if(p.wanted&&R()<.15){p.wanted=false;sentence(rint(2,5),L('Cảnh sát tìm ra nơi bạn lẩn trốn.','The police track down your hideout.'))}
}
function peopleStep(){
  const p=P(),le=CTRY[p.country].le;
  for(const x of p.people){
    if(!x.alive)continue;x.age++;
    if(['friend','partner','spouse'].includes(x.role))x.rel=clamp(x.rel-rint(1,5),0,100);
    const h=x.age<5?.004:.00004*Math.exp(.088*(x.age+(79-le)));
    if(R()<h){x.alive=false;
      const close=['mother','father','spouse','partner','child'].includes(x.role);add('happy',close?-18:-8);
      log(L(`${roleName(x)[0]} ${x.name} qua đời ở tuổi ${x.age}.`,`Your ${roleName(x)[1].toLowerCase()} ${x.name} died at ${x.age}.`));
      if((x.role==='mother'||x.role==='father')&&x.money>0){const sib=p.people.filter(s=>s.role==='sibling'&&s.alive).length;const share=x.money/(sib+1);p.money+=share;log(L(`Bạn được thừa kế ${money(share)}.`,`You inherit ${money(share)}.`))}
    } else if(x.role==='partner'&&x.rel<12){x.gone=true;log(L(`${x.name} chia tay bạn.`,`${x.name} breaks up with you.`));add('happy',-10)}
  }
  p.people=p.people.filter(x=>!x.gone);
}
function twinsStep(){
  const p=P();if(![10,25,40,60,80].includes(p.age))return;
  const t=pick(S.twins),c=CTRY[t.code];
  if(t.death<p.age)log(L(`Người sinh cùng giây với bạn ở ${c.vi}, ${t.name}, đã mất năm ${t.death} tuổi.`,`${t.name}, born the same second as you in ${c.en}, died at ${t.death}.`));
  else log(L(`Ở ${c.vi}, ${t.name} cũng vừa tròn ${p.age} tuổi${t.job&&p.age>=25?', đang làm '+JOBS[t.job].n[0].toLowerCase():''}.`,`In ${c.en}, ${t.name} also just turned ${p.age}${t.job&&p.age>=25?', working as a '+JOBS[t.job].n[1].toLowerCase():''}.`));
}
function ageUp(){
  const p=P();if(!p.alive||modalOpen)return;
  p.age++;p.used={};p.listings=null;p.houseOffers=null;p.log.push({age:p.age,lines:[]});
  if(p.age<45&&!p.addict)add('health',Math.max(0,Math.round((80-p.st.health)*.15)));
  if(p.age>40)add('health',-rint(0,p.age>65?4:2));
  add('happy',Math.round((55-p.st.happy)*.1));
  if(p.age<25)add('looks',rint(-1,2));else if(p.age>45)add('looks',-rint(0,2));
  econStep();prisonStep();eduStep();jobStep();bizStep();financeStep();
  if(p.addict){add('health',-rint(2,6));add('happy',-2);p.money-=1500*F();log(L('Cơn nghiện tiếp tục bào mòn sức khỏe và ví tiền của bạn.','Your addiction keeps draining your health and wallet.'))}
  peopleStep();twinsStep();
  if(p.money<0){p.debt+=-p.money;p.money=0}
  if(p.st.health<=0||R()<hazard(p.age,CTRY[p.country].le,p.st.health,p.addict)){die();return}
  // events
  const q=S.queue.splice(0);
  const elig=EVENTS.filter(e=>p.age>=e.age[0]&&p.age<=e.age[1]&&(!e.once||!p.seen[e.id])&&(!e.c||e.c(p))&&(p.prison>0?(e.prison||e.any):!e.prison));
  let n=R()<.6?1:(R()<.55?2:0);
  while(n-->0&&elig.length){const e=wpick(elig,x=>x.w);q.push(e.id);elig.splice(elig.indexOf(e),1)}
  save();render();
  evQ=q;nextEvent();
}
function causeOfDeath(){
  const p=P(),f=F();
  if(p.st.health<=0&&p.addict&&R()<.6)return L('Biến chứng do nghiện','Complications of addiction');
  if(p.age<=5)return f<.3?pick([L('Sốt rét','Malaria'),L('Viêm phổi','Pneumonia'),L('Tiêu chảy cấp','Severe diarrhea')]):pick([L('Bệnh bẩm sinh','Congenital illness'),L('Tai nạn','Accident')]);
  if(p.age<40)return pick([L('Tai nạn giao thông','Traffic accident'),L('Đuối nước','Drowning'),L('Bệnh hiểm nghèo','Serious illness')]);
  if(p.age<75)return pick([L('Đau tim','Heart attack'),L('Ung thư','Cancer'),L('Đột quỵ','Stroke')]);
  return pick([L('Tuổi già','Old age'),L('Suy tim','Heart failure'),L('Viêm phổi','Pneumonia')]);
}
function die(){
  const p=P();p.alive=false;p.cause=causeOfDeath();
  log(L(`Bạn qua đời ở tuổi ${p.age}. Nguyên nhân: ${p.cause[0].toLowerCase()}.`,`You died at ${p.age}. Cause: ${p.cause[1].toLowerCase()}.`));
  evQ=[];closeModal();U.sheet=null;U.screen='death';const tt=document.getElementById('toast');if(tt)tt.hidden=true;save();render();
}
function ribbonFor(p){
  const nw=netWorth(p);
  if(p.prisonTotal>=10)return'jailbird';if(p.escapes>=3)return'houdini';if(nw>=1e7)return'loaded';
  if(p.bizSold>0&&nw>=1e6)return'tycoon';if(p.cnt.kids>=4)return'fertile';if(p.addict)return'addict';
  if(p.cnt.casino>=12)return'gambler';if(p.cnt.club>=15)return'party';if(nw>=1e6)return'rich';
  if(p.cnt.partners>=8)return'heartbreaker';if(p.edu.degree>=4&&p.st.smarts>=80)return'academic';
  if(p.karma>=85)return'hero';if(p.karma<=15)return'wicked';if(p.age>=95)return'elder';
  if(p.cnt.acts<6&&p.age>20)return'lazy';return'mediocre';
}

function sentence(years,why){
  const p=P();p.prison=years;p.job=null;if(['uni','trade','grad'].includes(p.edu.stage)){p.edu.stage='done';p.edu.tuition=0}
  karma(-8);add('happy',-15);const pa=partner();if(pa)pa.rel=clamp(pa.rel-20,0,100);
  log(both(why,L(`Bạn bị kết án ${years} năm tù.`,`You are sentenced to ${years} years in prison.`)));
}
function courtEvent(years,crime){
  return{id:'court',tag:L('Tòa án','Court'),text:()=>L(`Bạn bị bắt vì ${crime[0]}. Công tố đề nghị ${years} năm tù.`,`You are arrested for ${crime[1]}. The prosecutor asks for ${years} years.`),
   choices:[
    {l:L(`Thuê luật sư giỏi (${money(9000*F())})`,`Hire a top lawyer (${money(9000*F())})`),run:p=>{const cost=9000*F();if(p.money<cost){sentence(years,L('Bạn không đủ tiền thuê luật sư.','You cannot afford the lawyer.'));return L('Không đủ tiền, bạn phải nhận luật sư công.','No money, so you get a public defender.')}
      p.money-=cost;if(R()<.5){karma(-3);return L('Luật sư tìm ra kẽ hở. Bạn được tha bổng!','Your lawyer finds a loophole. You walk free!')}const y=Math.max(1,Math.round(years*.6));sentence(y,L('Luật sư giúp giảm án.','Your lawyer gets the sentence reduced.'));return L(`Bạn lĩnh ${y} năm tù.`,`You get ${y} years.`)}},
    {l:L('Dùng luật sư công','Use a public defender'),run:p=>{if(R()<.2)return L('Thật bất ngờ, bạn được tha bổng.','Against all odds, you are acquitted.');sentence(years,L('Luật sư công gần như không làm gì.','The public defender barely tries.'));return L(`Bạn lĩnh ${years} năm tù.`,`You get ${years} years.`)}},
    {l:L('Nhận tội để được giảm án','Plead guilty for a lighter sentence'),run:p=>{const y=Math.max(1,Math.round(years*.7));sentence(y,L('Bạn nhận tội.','You plead guilty.'));return L(`Bạn lĩnh ${y} năm tù.`,`You get ${y} years.`)}}
   ]};
}
function crime(o){
  return p=>{const f=F();p.cnt.crime++;karma(-o.k);
    const luck=hasT('lucky')?.1:0;
    if(R()<o.ok+luck){const gain=rint(o.min,o.max)*Math.max(f,.15);p.money+=gain;add('happy',3);return L(`${o.win[0]} Bạn kiếm được ${money(gain)}.`,`${o.win[1]} You got ${money(gain)}.`)}
    if(R()<o.caught){const y=rint(o.y[0],o.y[1]);if(y===0){p.money=Math.max(0,p.money-300*f);return L('Bạn bị bắt và chỉ bị phạt tiền.','You get caught and only fined.')}return courtEvent(y,o.n)}
    return L('Bạn thất bại nhưng chạy thoát được.','It fails, but you get away.');
  };
}

      if(R()<ch){p.cnt.partners++;add('happy',10);if(partner()){p.cheated=true;return L(`${n.name} đồng ý. Bạn bắt đầu lén lút hẹn hò sau lưng người yêu.`,`${n.name} says yes. You start seeing them behind your partner's back.`)}p.people.push(n);return L(`${n.name} đồng ý! Hai người chính thức hẹn hò.`,`${n.name} says yes! You are officially dating.`)}

function breakup(pa){const p=P();
  if(pa.role==='spouse'){const loss=p.money*.4;p.money-=loss;log(L(`Ly hôn khiến bạn mất ${money(loss)}.`,`The divorce costs you ${money(loss)}.`))}
  pa.alive=false;pa.gone=true;p.people=p.people.filter(x=>x!==pa);add('happy',-12);
  return pa.role==='spouse'?L(`Bạn và ${pa.name} ly hôn.`,`You and ${pa.name} divorce.`):L(`Bạn và ${pa.name} chia tay.`,`You and ${pa.name} break up.`);
}
function retire(p){if(!p.job)return;const j=JOBS[p.job.id];p.pension=j.base*F()*(1+.12*p.job.level)*.4;p.job=null;p.retired=true}
function haveBaby(how){const p=P(),g=R()<.5?'m':'f';const k=npc('child',g,0);k.name=k.name.split(' ')[0]+' '+p.last;k.rel=80;p.people.push(k);p.cnt.kids++;add('happy',12);
  return L(`${how[0]} ${k.name} chào đời!`,`${how[1]} ${k.name} is born!`)}

/* ---------- event runner ---------- */
function nextEvent(){
  const p=P();if(!p.alive){return}
  if(!evQ.length){save();render();return}
  let e=evQ.shift();if(typeof e==='string')e=SPECIAL[e]?{id:e,...SPECIAL[e]}:EVENTS.find(x=>x.id===e);
  if(!e){nextEvent();return}
  if(e.c&&!SPECIAL[e.id]&&!e.c(p)){nextEvent();return}
  if(e.id)p.seen[e.id]=1;
  if(e.prep)e.prep(p);
  if(e.auto){log(e.text(p));e.auto(p);if(p.st.health<=0){die();return}nextEvent();return}
  showEvent(e);
}
function trigger(e){evQ.unshift(e);if(!modalOpen)nextEvent()}
function showEvent(e){
  const p=P();const text=e.text(p);modalOpen=true;
  const box=`<div class="shade modal" role="dialog" aria-modal="true"><div class="box">
    <div class="tag">${esc(tr(e.tag||L('Tuổi '+p.age,'Age '+p.age)))}</div><p>${esc(tr(text))}</p>
    <div class="choices">${e.choices.map((c,i)=>`<button class="btn" data-a="choose" data-v="${i}">${esc(tr(c.l))}</button>`).join('')}</div></div></div>`;
  layer(box);
  layerEl().onclick=ev=>{const b=ev.target.closest('[data-a="choose"]');if(!b)return;
    const c=e.choices[+b.dataset.v];const res=c.run(p);
    if(res&&res.choices){log(both(text,L('→ '+tr(c.l),'→ '+tr(c.l))));modalOpen=false;evQ.unshift(res);nextEvent();return}
    log(both(text,res));
    showResult(res);
  };
}
function showResult(res){
  const p=P();
  layer(`<div class="shade modal" role="dialog" aria-modal="true"><div class="box"><div class="tag">${esc(tr(L('Kết quả','Outcome')))}</div><p>${esc(tr(res))}</p>
    <button class="btn primary" data-a="ok" style="width:100%">${esc(tr(L('Tiếp tục','Continue')))}</button></div></div>`);
  layerEl().onclick=ev=>{if(!ev.target.closest('[data-a="ok"]'))return;closeModal();
    if(p.money<0){p.debt+=-p.money;p.money=0}
    if(p.st.health<=0){die();return}nextEvent()};
}
function closeModal(){modalOpen=false;layer('')}
const layerEl=()=>document.getElementById('layer');
function layer(html){layerEl().innerHTML=html;layerEl().onclick=null}

function casinoEvent(){
  const p=P();const amounts=[100,1000,Math.max(100,Math.round(p.money*.25))];
  return{id:'casino',tag:L('Sòng bạc','Casino'),text:()=>L(`Bạn đứng trước bàn roulette với ${money(p.money)} trong túi.`,`You stand at the roulette table with ${money(p.money)} in your pocket.`),choices:[
    ...amounts.map((a,i)=>({l:L(i===2?`Cược 25% tiền (${money(a)})`:`Cược ${money(a)}`,i===2?`Bet 25% of cash (${money(a)})`:`Bet ${money(a)}`),run:p=>{if(p.money<a)return L('Bạn không đủ tiền cho mức cược này.','You do not have enough for that bet.');
      if(R()<(hasT('lucky')?.52:.46)){p.money+=a;add('happy',6);return L(`Bạn thắng ${money(a)}!`,`You win ${money(a)}!`)}p.money-=a;add('happy',-5);return L(`Bạn thua ${money(a)}.`,`You lose ${money(a)}.`)}})),
    {l:L('Thôi, về','Walk away'),run:()=>L('Bạn rời sòng bạc với cái đầu tỉnh táo.','You leave with a clear head.')}]};

function emigrateEvent(){
  const p=P();const opts=Object.keys(CTRY).filter(k=>k!==p.country).sort(()=>R()-.5).slice(0,3);
  return{id:'emig',tag:L('Di cư','Emigration'),text:()=>L('Bạn muốn chuyển tới đâu?','Where do you want to move?'),choices:[
    ...opts.map(k=>{const c=CTRY[k],price=Math.round(8000*cf(k));return{l:L(`${c.vi} (${money(price)})`,`${c.en} (${money(price)})`),run:p=>{
      if(p.money<price)return L('Bạn không đủ tiền làm thủ tục.','You cannot afford the paperwork.');
      p.money-=price;const ch=.35+p.st.smarts/250+(p.money>50000?.2:0)-(cf(k)-cf(p.country))*.3;
      if(R()<ch){p.country=k;p.job=null;p.listings=null;add('happy',8);return L(`Visa được duyệt! Bạn chuyển tới ${c.vi}.`,`Visa approved! You move to ${c.en}.`)}
      return L('Hồ sơ visa bị từ chối.','Your visa is denied.')}}}),
    {l:L('Thôi, ở lại','Never mind'),run:()=>L('Bạn quyết định ở lại.','You decide to stay.')}]};
}
function doAct(id){
  const p=P(),a=ACTS.find(x=>x.id===id);if(!a||!p.alive)return;
  if(p.used[id]){toast(L('Bạn đã làm việc này trong năm nay.','You already did this this year.'));return}
  if(a.need&&p.money<cost(a.need)){toast(L('Bạn không đủ tiền.','You cannot afford it.'));return}
  p.used[id]=1;p.cnt.acts++;
  const res=a.run(p);
  if(res&&res.choices){U.sheet=null;render();trigger(res);return}
  log(res);if(p.money<0){p.debt+=-p.money;p.money=0}
  if(p.st.health<=0){die();return}
  save();render();toast(res);
}

/* ---------- people actions ---------- */
function roleName(x){const m=x.g==='m';return{mother:L('Mẹ','Mother'),father:L('Bố','Father'),sibling:m?L('Anh/em trai','Brother'):L('Chị/em gái','Sister'),partner:L('Người yêu','Partner'),spouse:m?L('Chồng','Husband'):L('Vợ','Wife'),child:m?L('Con trai','Son'):L('Con gái','Daughter'),friend:L('Bạn','Friend')}[x.role]}
function personActs(x){
  const p=P(),out=[];
  out.push(['time',L('Dành thời gian bên nhau','Spend time together')]);
  out.push(['gift',L(`Tặng quà (${money(cost(150))})`,`Give a gift (${money(cost(150))})`)]);
  out.push(['argue',L('Cãi nhau','Start an argument')]);
  if((x.role==='mother'||x.role==='father')&&p.age>=5)out.push(['askmoney',L('Xin tiền','Ask for money')]);
  if(x.role==='partner'||x.role==='spouse'){
    out.push(['date',L(`Hẹn hò lãng mạn (${money(cost(200))})`,`Romantic date (${money(cost(200))})`)]);
    if(p.age>=18)out.push(['intimate',L('Thân mật','Be intimate')]);
    if(x.role==='partner')out.push(['propose',L('Cầu hôn','Propose')]);
    out.push(['baby',x.g!==p.g?L('Thử có em bé','Try for a baby'):L(`Nhận con nuôi (${money(cost(20000))})`,`Adopt a child (${money(cost(20000))})`)]);
    out.push(['leave',x.role==='spouse'?L('Ly hôn','Divorce'):L('Chia tay','Break up')]);
  }
  if(x.role==='child'&&p.age>=18)out.push(['allow',L(`Cho tiền (${money(cost(1000))})`,`Give money (${money(cost(1000))})`)]);
  return out;
}
function doPerson(id,act){
  const p=P(),x=p.people.find(y=>y.id===id);if(!x)return;const key=act+id;
  if(p.used[key]&&!['leave'].includes(act)){toast(L('Đã làm việc này với người này trong năm nay.','Already done with them this year.'));return}
  p.used[key]=1;p.cnt.acts++;let res;
  const rel=d=>x.rel=clamp(x.rel+d,0,100);
  switch(act){
   case'time':rel(rint(4,10));add('happy',3);res=L(`Bạn và ${x.name} có một khoảng thời gian vui vẻ.`,`You and ${x.name} have a good time.`);break;
   case'gift':if(p.money<cost(150)){res=L('Bạn không đủ tiền mua quà.','You cannot afford a gift.');break}p.money-=cost(150);rel(rint(6,14));res=L(`${x.name} rất thích món quà.`,`${x.name} loves the gift.`);break;
   case'argue':rel(-rint(8,20));add('happy',-3);res=L(`Bạn và ${x.name} cãi nhau to tiếng.`,`You and ${x.name} have a loud fight.`);break;
   case'askmoney':{if(R()<x.rel/140&&x.money>0){const a=Math.max(5,Math.round(x.money*rint(1,4)/100));x.money-=a;p.money+=a;res=L(`${x.name} cho bạn ${money(a)}.`,`${x.name} gives you ${money(a)}.`)}else{rel(-4);res=L(`${x.name} từ chối.`,`${x.name} says no.`)}break}
   case'date':if(p.money<cost(200)){res=L('Bạn không đủ tiền.','You cannot afford it.');break}p.money-=cost(200);rel(rint(6,12));add('happy',5);res=L(`Một buổi tối lãng mạn với ${x.name}.`,`A romantic evening with ${x.name}.`);break;
   case'intimate':rel(rint(4,10));add('happy',rint(5,9));res=L(`Bạn và ${x.name} dành cho nhau một đêm nồng nàn. Đèn tắt.`,`You and ${x.name} share a passionate night. Lights out.`);
     if(x.g!==p.g&&p.age<50&&R()<.12)res=both(res,haveBaby(L('Chín tháng sau,','Nine months later,')));break;
   case'propose':if(x.rel>=60&&R()<.75){x.role='spouse';const c=cost(15000);p.money-=Math.min(c,p.money);add('happy',15);res=L(`${x.name} đồng ý! Hai người tổ chức đám cưới.`,`${x.name} says yes! You get married.`)}else{rel(-15);add('happy',-8);res=L(`${x.name} từ chối lời cầu hôn.`,`${x.name} turns down your proposal.`)}break;
   case'baby':if(x.g!==p.g){res=(p.age<50&&R()<.4)?haveBaby(L('Tin vui!','Good news!')):L('Lần này chưa thành.','No luck this time.')}else{const c=cost(20000);if(p.money<c){res=L('Bạn không đủ tiền làm thủ tục nhận con nuôi.','You cannot afford the adoption.');break}p.money-=c;res=haveBaby(L('Thủ tục hoàn tất.','The adoption goes through.'))}break;
   case'leave':res=breakup(x);U.sheet='people';break;
   case'allow':if(p.money<cost(1000)){res=L('Bạn không đủ tiền.','You cannot afford it.');break}p.money-=cost(1000);rel(8);res=L(`${x.name} cảm ơn bạn.`,`${x.name} thanks you.`);break;
  }
  log(res);save();render();toast(res);
}

/* ---------- career and money actions ---------- */
function listings(){const p=P();if(!p.listings){const ks=Object.keys(JOBS).sort(()=>R()-.5).slice(0,7);p.listings=ks}return p.listings}
function applyJob(id){
  const p=P(),j=JOBS[id];
  if(p.edu.degree<j.deg){toast(L(`Cần bằng ${DEG[j.deg][0].toLowerCase()}.`,`Requires a ${DEG[j.deg][1].toLowerCase()} degree.`));return}
  if(p.used['apply'+id]){toast(L('Bạn đã nộp đơn vị trí này năm nay.','You already applied this year.'));return}
  p.used['apply'+id]=1;
  let ch=.55+(p.st.smarts-j.sm)/120+(j.lk?(p.st.looks-j.lk)/90:0)-(S.econ.phase==='recession'?.15:S.econ.phase==='crisis'?.3:0);
  let res;
  if(R()<ch){p.job={id,level:0,perf:50,yrs:0};p.retired=false;add('happy',6);res=L(`Bạn được nhận vào vị trí ${j.n[0].toLowerCase()}!`,`You got the ${j.n[1]} job!`)}
  else res=L(`Hồ sơ ${j.n[0].toLowerCase()} bị từ chối.`,`Your ${j.n[1]} application was rejected.`);
  log(res);save();render();toast(res);
}
function careerAct(a){
  const p=P();let res;
  if(a==='study'){if(p.used.study){toast(L('Bạn đã học chăm năm nay rồi.','Already studied hard this year.'));return}p.used.study=1;add('smarts',rint(2,5));add('happy',-2);res=L('Bạn vùi đầu vào sách vở.','You bury yourself in books.')}
  if(a==='dropuni'){p.edu.stage='done';p.edu.tuition=0;res=L('Bạn bỏ học giữa chừng.','You drop out.')}
  if(a==='work'){if(p.used.work){toast(L('Bạn đã làm chăm năm nay rồi.','Already worked hard this year.'));return}p.used.work=1;p.job.perf=clamp(p.job.perf+rint(4,10),0,100);add('happy',-3);res=L('Bạn ở lại văn phòng tới khuya.','You stay late at the office.')}
  if(a==='raise'){if(p.used.raise){toast(L('Bạn đã xin tăng lương năm nay.','Already asked this year.'));return}p.used.raise=1;if(p.job.perf>65&&R()<.6&&p.job.level<6){p.job.level++;res=L('Sếp đồng ý tăng lương cho bạn.','Your boss gives you a raise.')}else{p.job.perf=clamp(p.job.perf-10,0,100);res=L('Sếp cười và lắc đầu.','Your boss laughs and shakes their head.')}}
  if(a==='quit'){res=L(`Bạn nghỉ việc ${JOBS[p.job.id].n[0].toLowerCase()}.`,`You quit your ${JOBS[p.job.id].n[1]} job.`);p.job=null}
  if(a==='retire'){retire(p);res=L('Bạn nghỉ hưu và nhận lương hưu hằng năm.','You retire and start drawing a pension.')}
  log(res);save();render();toast(res);
}
function invest(id,how){
  const p=P();let amt=0;
  if(how==='sell'){amt=p.inv[id];if(amt<=0)return;p.money+=amt;p.inv[id]=0;toast(L(`Đã bán, thu về ${money(amt)}.`,`Sold for ${money(amt)}.`))}
  else{amt=how==='q'?p.money*.25:Math.round(+how*Math.max(F(),.2));if(amt<1||p.money<amt){toast(L('Bạn không đủ tiền mặt.','Not enough cash.'));return}p.money-=amt;p.inv[id]+=amt;toast(L(`Đã đầu tư ${money(amt)}.`,`Invested ${money(amt)}.`))}
  save();render();
}
function houseOffers(){const p=P();if(!p.houseOffers){const f=F();p.houseOffers=[0,1].map(()=>({id:uid(),value:Math.round(220000*f*(0.5+R()*1.5)),kind:pick([L('Căn hộ chung cư','Apartment'),L('Nhà phố','Townhouse'),L('Biệt thự nhỏ','Small villa')])}))}return p.houseOffers}
function moneyAct(a,v){
  const p=P(),f=F();let res;
  if(a==='buyhouse'||a==='mortgage'){const h=p.houseOffers.find(x=>x.id===v);if(!h)return;const need=a==='buyhouse'?h.value:h.value*.2;
    if(p.money<need){toast(L('Bạn không đủ tiền.','Not enough cash.'));return}
    p.money-=need;if(a==='mortgage')p.debt+=h.value*.8;p.houses.push({id:h.id,value:h.value,kind:h.kind,rented:false});p.houseOffers=p.houseOffers.filter(x=>x!==h);
    res=L(`Bạn mua ${h.kind[0].toLowerCase()} giá ${money(h.value)}${a==='mortgage'?' (trả góp)':''}.`,`You buy a ${h.kind[1].toLowerCase()} for ${money(h.value)}${a==='mortgage'?' (mortgage)':''}.`)}
  if(a==='rent'){const h=p.houses.find(x=>x.id===v);h.rented=!h.rented;res=h.rented?L('Bạn cho thuê căn nhà.','You rent the property out.'):L('Bạn ngừng cho thuê.','You stop renting it out.')}
  if(a==='sellhouse'){const h=p.houses.find(x=>x.id===v);p.money+=h.value*.97;p.houses=p.houses.filter(x=>x!==h);res=L(`Bạn bán nhà, thu về ${money(h.value*.97)}.`,`You sell for ${money(h.value*.97)}.`)}
  if(a==='open'){const t=BIZ[v],c=t.cap*f;if(p.money<c){toast(L('Bạn không đủ vốn.','Not enough capital.'));return}p.money-=c;
    const nm=pick(['Nova','Lotus','Atlas','Mango','Cobalt','Sunny','Orbit','Maple'])+' '+tr(t.n);p.biz={type:v,name:nm,value:c,yrs:0,evade:false,mkt:false,last:0};
    res=L(`Bạn mở ${nm} với vốn ${money(c)}.`,`You open ${nm} with ${money(c)} in capital.`)}
  if(a==='mkt'){const c=p.biz.value*.05;if(p.used.mkt){toast(L('Đã chạy marketing năm nay.','Marketing already running this year.'));return}if(p.money<c){toast(L('Bạn không đủ tiền.','Not enough cash.'));return}p.used.mkt=1;p.money-=c;p.biz.mkt=true;res=L(`Bạn chi ${money(c)} cho chiến dịch quảng cáo.`,`You spend ${money(c)} on an ad campaign.`)}
  if(a==='inject'){const c=p.money*.25;if(c<100){toast(L('Bạn không đủ tiền.','Not enough cash.'));return}p.money-=c;p.biz.value+=c;res=L(`Bạn rót thêm ${money(c)} vào công ty.`,`You inject ${money(c)} into the company.`)}
  if(a==='evade'){p.biz.evade=!p.biz.evade;if(p.biz.evade)karma(-5);res=p.biz.evade?L('Bạn bắt đầu "tối ưu" sổ sách để trốn thuế.','You start cooking the books to dodge taxes.'):L('Bạn quay lại khai thuế trung thực.','You go back to honest tax filings.')}
  if(a==='sellbiz'){const v2=p.biz.value*(0.8+R()*.5);p.money+=v2;p.bizSold++;res=L(`Bạn bán ${p.biz.name} với giá ${money(v2)}.`,`You sell ${p.biz.name} for ${money(v2)}.`);p.biz=null}
  if(a==='loan'){if(p.used.loan){toast(L('Ngân hàng chỉ duyệt một khoản vay mỗi năm.','The bank approves one loan per year.'));return}p.used.loan=1;const c=Math.round(10000*f+p.income*.5);p.money+=c;p.debt+=c;res=L(`Ngân hàng cho bạn vay ${money(c)}, lãi 7%/năm.`,`The bank lends you ${money(c)} at 7% a year.`)}
  if(a==='repay'){const c=Math.min(p.money,p.debt);if(c<=0)return;p.money-=c;p.debt-=c;res=L(`Bạn trả ${money(c)} nợ.`,`You repay ${money(c)} of debt.`)}
  log(res);save();render();toast(res);
}

      +houseOffers().map(h=>`<div class="item" style="flex-wrap:wrap"><div class="grow"><div class="t">${tr(h.kind)} <span class="chip">${tr(L('Đang rao bán','For sale'))}</span></div><div class="s num">${money(h.value)}</div></div><div class="row"><button class="btn small primary" data-a="money" data-v="buyhouse|${h.id}">${tr(L('Mua đứt','Buy outright'))}</button><button class="btn small" data-a="money" data-v="mortgage|${h.id}">${tr(L('Trả góp, trả trước 20%','Mortgage, 20% down'))}</button></div></div>`).join('')+'</div>';
    b+=`<div class="sec">${tr(L('Kinh doanh','Business'))}</div>`;
    if(p.biz){const bz=p.biz;b+=`<div class="card"><div class="row" style="justify-content:space-between"><div><div style="font-weight:800;font-size:17px">${esc(bz.name)}</div><div class="muted" style="font-size:13px">${tr(BIZ[bz.type].n)} · ${bz.yrs} ${tr(L('năm','yrs'))}${bz.ipo?' · IPO':''}</div></div><div style="text-align:right"><div class="num" style="font-weight:700">${money(bz.value)}</div><div class="num ${bz.last>=0?'up':'down'}" style="font-size:12px">${bz.yrs?(bz.last>=0?'+':'')+money(bz.last):''}</div></div></div>
      <div class="row" style="margin-top:12px"><button class="btn small" data-a="money" data-v="mkt|">${tr(L('Chạy quảng cáo (5% giá trị)','Run ads (5% of value)'))}</button><button class="btn small" data-a="money" data-v="inject|">${tr(L('Rót thêm 25% tiền mặt','Inject 25% of cash'))}</button><button class="btn small ${bz.evade?'danger':''}" data-a="money" data-v="evade|">${bz.evade?tr(L('Ngừng trốn thuế','Stop dodging taxes')):tr(L('Trốn thuế','Dodge taxes'))}</button><button class="btn small danger" data-a="money" data-v="sellbiz|">${tr(L('Bán công ty','Sell company'))}</button></div></div>`}
    else b+=`<div class="list">`+Object.entries(BIZ).map(([k,t])=>`<div class="item"><div class="grow"><div class="t">${tr(t.n)}</div><div class="s">${tr(L('Vốn','Capital'))} <span class="num">${money(t.cap*F())}</span> · ${tr(L('rủi ro','risk'))} ${t.sd>=.4?tr(L('rất cao','very high')):t.sd>=.2?tr(L('cao','high')):tr(L('vừa','medium'))}</div></div><button class="btn small primary" data-a="money" data-v="open|${k}">${tr(L('Mở','Open'))}</button></div>`).join('')+'</div>';
    b+=`<div class="sec">${tr(L('Ngân hàng','Bank'))}</div><div class="row"><button class="btn small" data-a="money" data-v="loan|">${tr(L('Vay','Borrow'))} ${money(Math.round(10000*F()+p.income*.5))}</button>${p.debt>0?`<button class="btn small" data-a="money" data-v="repay|">${tr(L('Trả nợ','Repay debt'))}</button>`:''}</div>`;
    return sheetWrap(tr(L('Tài chính','Money')),b);
  }
  if(s==='people'){
    const ppl=p.people.filter(x=>x.alive);
    const b=ppl.length?`<div class="list">${ppl.map(x=>`<button class="item" data-a="person" data-v="${x.id}"><div class="grow"><div class="t">${esc(x.name)}</div><div class="s">${tr(roleName(x))} · ${x.age} ${tr(L('tuổi','yrs'))}</div></div><div style="width:90px"><div class="bar"><i style="width:${x.rel}%;background:${barColor(x.rel)}"></i></div></div></button>`).join('')}</div>`:`<p class="muted">${tr(L('Bạn không còn ai bên cạnh.','You have no one left.'))}</p>`;
    return sheetWrap(tr(L('Quan hệ','People')),b+(p.age>=18&&!partner()?`<p class="muted" style="font-size:13px;margin-top:14px">${tr(L('Muốn có người yêu? Thử hộp đêm hoặc app hẹn hò trong tab Hoạt động.','Want a partner? Try clubbing or a dating app in Activities.'))}</p>`:''));
  }
  if(s&&s.startsWith('person:')){
    const x=p.people.find(y=>y.id===s.slice(7));if(!x){U.sheet='people';return renderSheet()}
    const info=`<div class="card"><div style="font-weight:800;font-size:18px">${esc(x.name)}</div><div class="muted" style="font-size:13px">${tr(roleName(x))} · ${x.age} ${tr(L('tuổi','yrs'))}${x.job?' · '+tr(x.job):''}${x.looks?` · ${tr(L('Ngoại hình','Looks'))} ${x.looks}`:''}</div>
      <div class="stat" style="margin-top:10px"><span>${tr(L('Thân thiết','Closeness'))}</span><div class="bar"><i style="width:${x.rel}%;background:${barColor(x.rel)}"></i></div><span class="num">${x.rel}</span></div></div>`;
    const acts=personActs(x).map(([k,l])=>`<button class="act" data-a="pact" data-v="${x.id}|${k}"${p.prison&&k!=='argue'?' disabled':''}><b>${esc(tr(l))}</b></button>`).join('');
    return sheetWrap(`<button class="iconbtn" data-a="sheet" data-v="people" style="margin-right:8px">←</button>${esc(x.name.split(' ')[0])}`,info+`<div class="sec">${tr(L('Hành động','Actions'))}</div><div class="grid2">${acts}</div>`);
  }
  if(s==='acts'){
    let b='';
    if(p.prison){b+=`<p class="muted">${tr(L(`Bạn đang ngồi tù, còn ${p.prison} năm.`,`You are in prison with ${p.prison} years left.`))}</p><div class="grid2">`+ACTS.filter(a=>a.g==='prison').map(a=>actBtn(a)).join('')+'</div>';return sheetWrap(tr(L('Hoạt động','Activities')),b)}
    for(const[g,gl] of ACT_GROUPS){const list=ACTS.filter(a=>a.g===g&&(!a.c||a.c(p)));if(!list.length)continue;
      b+=`<div class="sec">${tr(gl)}${g==='party'||g==='love'?' · 18+':''}</div><div class="grid2">${list.map(a=>actBtn(a)).join('')}</div>`}
    return sheetWrap(tr(L('Hoạt động','Activities')),b);
  }
  if(s==='menu'){
    return sheetWrap(tr(L('Menu','Menu')),`<div class="list"><button class="item" data-a="newlife"><div class="grow"><div class="t">${tr(L('Bỏ đời này, bắt đầu đời mới','Abandon this life and start over'))}</div><div class="s">${tr(L('Đời hiện tại sẽ bị xóa','The current life will be deleted'))}</div></div></button>
      <button class="item" data-a="birthcard"><div class="grow"><div class="t">${tr(L('Xem lại thẻ khai sinh','View your birth card'))}</div></div></button></div>`);
  }
  return'';
}
function actBtn(a){const p=P();const locked=p.age<a.age;const used=p.used[a.id];const d=typeof a.d==='function'?a.d():tr(a.d);
  return`<button class="act" data-a="act" data-v="${a.id}"${locked||used?' disabled':''}><b>${esc(tr(a.l))}</b><span>${locked?tr(L(`Từ ${a.age} tuổi`,`From age ${a.age}`)):used?tr(L('Đã làm năm nay','Done this year')):esc(d)}</span></button>`}
function showBirthCard(){
  const p=P(),c=CTRY[p.country],mom=p.people.find(x=>x.role==='mother'),dad=p.people.find(x=>x.role==='father');
  const share=(c.b/Object.values(CTRY).reduce((s,x)=>s+x.b,0)*100).toFixed(1);
  modalOpen=true;
  layer(`<div class="shade modal" role="dialog" aria-modal="true"><div class="box birth">
    <div class="odds">${tr(L('Bạn là 1 trong 8 tỷ','You are 1 in 8 billion'))}</div>
    <div class="big">${esc(fullName(p))}</div>
    <div class="muted">${tr(L(`${p.g==='m'?'Bé trai':'Bé gái'} · ${c.vi}`,`${p.g==='m'?'Boy':'Girl'} · ${c.en}`))}</div>
    <div class="facts">
      <div><span>${tr(L('Gia cảnh','Family'))}</span>${tr(TIERS[p.tier])}</div>
      <div><span>${tr(L('Tuổi thọ trung bình','Life expectancy'))}</span><b class="num">${c.le}</b></div>
      <div><span>${tr(L('Mẹ','Mother'))}</span>${mom?esc(mom.name):'-'}</div>
      <div><span>${tr(L('Bố','Father'))}</span>${dad?esc(dad.name):'-'}</div>
      <div><span>${tr(L('GDP/người','GDP per person'))}</span><b class="num">${money(c.gdp)}</b></div>
      <div><span>${tr(L('Tỉ lệ ca sinh toàn cầu*','Share of births*'))}</span><b class="num">${share}%</b></div>
    </div>
    <p class="muted" style="font-size:12px;margin:0 0 14px">${tr(L('*Trong 24 nước có trong bản demo.','*Among the 24 countries in this demo.'))}</p>
    <button class="btn accent" data-a="okbirth" style="width:100%">${tr(L('Bắt đầu sống','Start living'))}</button></div></div>`);
  layerEl().onclick=ev=>{if(ev.target.closest('[data-a="okbirth"]')){closeModal();render()}};
}
function renderDeath(){
  const p=P(),c=CTRY[p.country],rb=RIBBONS[ribbonFor(p)],nw=netWorth(p);
  const rows=[{me:1,name:fullName(p),code:p.country,death:p.age,note:p.job?tr(JOBS[p.job.id].n):p.retired?tr(L('Đã nghỉ hưu','Retired')):tr(DEG[p.edu.degree])}]
    .concat(S.twins.map(t=>({name:t.name,code:t.code,death:t.death,note:t.job?tr(JOBS[t.job].n):t.death<18?tr(L('Mất khi còn nhỏ','Died young')):tr(TIERS[t.tier])})));
  const ks=kids();
  return`<div class="app"><div class="screen">
   <div class="row" style="justify-content:flex-end">${langBtn()}</div>
   <div class="stone"><div class="muted num" style="font-size:12px">${tr(L('Yên nghỉ','Rest in peace'))}</div><h2>${esc(fullName(p))}</h2>
     <div class="muted" style="margin-top:4px">${tr(c)} · ${p.age} ${tr(L('tuổi','years old'))}</div>
     <div style="margin-top:8px">${tr(L('Nguyên nhân','Cause'))}: ${tr(p.cause)}</div>
     <div class="ribbon">${tr(rb.n)}</div><div class="muted" style="font-size:13px;margin-top:6px">${tr(rb.d)}</div></div>
   <div class="kpis"><div class="kpi"><span>${tr(L('Tài sản','Net worth'))}</span><b>${money(nw)}</b></div><div class="kpi"><span>${tr(L('Con cái','Children'))}</span><b>${p.cnt.kids}</b></div><div class="kpi"><span>${tr(L('Năm trong tù','Years jailed'))}</span><b>${p.prisonTotal}</b></div></div>
   <div class="card"><div class="sec" style="margin-top:0">${tr(L('5 người sinh cùng một giây','Five people born the same second'))}</div>
    <div class="tablewrap"><table class="cmp"><thead><tr><th>${tr(L('Tên','Name'))}</th><th>${tr(L('Nước','Country'))}</th><th>${tr(L('Mất ở tuổi','Died at'))}</th><th>${tr(L('Ghi chú','Note'))}</th></tr></thead>
    <tbody>${rows.map(r=>`<tr class="${r.me?'me':''}"><td>${esc(r.name)}${r.me?' ('+tr(L('bạn','you'))+')':''}</td><td>${esc(tr(CTRY[r.code]))}</td><td class="num">${r.death}</td><td>${esc(r.note)}</td></tr>`).join('')}</tbody></table></div>
    <p class="muted" style="font-size:12.5px;margin:10px 0 0">${tr(L(`Tuổi thọ trung bình ở ${c.vi} là ${c.le}. Bạn sống ${p.age>=c.le?'lâu hơn':'ngắn hơn'} mức đó ${Math.abs(p.age-c.le)} năm.`,`Life expectancy in ${c.en} is ${c.le}. You lived ${Math.abs(p.age-c.le)} years ${p.age>=c.le?'longer':'shorter'} than that.`))}</p></div>
   <button class="btn accent" data-a="tocreate" style="padding:15px;font-size:16px">${tr(L('Đời mới','New life'))}</button>
   ${ks.length?`<div class="sec">${tr(L('Chơi tiếp bằng con (nhận 70% tài sản sau thuế)','Continue as a child (inherits 70% after tax)'))}</div><div class="list">${ks.map(k=>`<button class="item" data-a="heir" data-v="${k.id}"><div class="grow"><div class="t">${esc(k.name)}</div><div class="s">${tr(roleName(k))} · ${k.age} ${tr(L('tuổi','yrs'))}</div></div></button>`).join('')}</div>`:''}
  </div></div>`;
}
function continueAsChild(id){
  const old=P(),k=old.people.find(x=>x.id===id);if(!k)return;
  const estate=Math.max(0,netWorth(old))*.7;
  const p=makePerson({country:old.country,g:k.g,orient:R()<.9?'straight':pick(['gay','bi']),first:k.name.split(' ')[0],last:old.last,age:k.age,tier:clamp(estate>1e6?3:estate>2e5?2:1,0,3),money:estate,gen:old.gen+1,traits:R()<.5?[pick(Object.keys(TRAITS))]:[]});
  if(k.age>=18)p.edu.degree=1;else if(k.age>=6)p.edu.stage='school';
  p.people=old.people.filter(x=>x.role==='child'&&x.alive&&x.id!==id).map(x=>({...x,role:'sibling'}));
  S={p,econ:S.econ,twins:makeTwins(),queue:[]};
  log(L(`Bạn là ${k.name}, thế hệ thứ ${p.gen}. Bạn thừa kế ${money(estate)} từ ${old.g==='m'?'bố':'mẹ'}.`,`You are ${k.name}, generation ${p.gen}. You inherit ${money(estate)} from your ${old.g==='m'?'father':'mother'}.`));
  U.screen='game';save();render();
}

/* ---------- toast, gate ---------- */
let toastT=null;
function toast(msg){let el=document.getElementById('toast');if(!el){el=document.createElement('div');el.id='toast';el.className='toast';el.setAttribute('role','status');document.body.appendChild(el)}
  el.textContent=tr(msg);el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{el.hidden=true},2800)}
function showGate(){
  modalOpen=true;
  layer(`<div class="shade modal gate" role="dialog" aria-modal="true"><div class="box"><div class="tag">18+</div>
   <h2 style="font-size:24px;margin-top:6px">${tr(L('Nội dung dành cho người lớn','Adult content'))}</h2>
   <p>${tr(L('Game có rượu, chất kích thích, tội phạm, cờ bạc, tình dục được ám chỉ và hài đen. Bạn xác nhận mình từ 18 tuổi trở lên?','This game includes alcohol, drugs, crime, gambling, implied sex and dark humor. Do you confirm you are 18 or older?'))}</p>
   <div class="choices"><button class="btn accent" data-a="gateok">${tr(L('Tôi đủ 18 tuổi','I am 18 or older'))}</button><button class="btn" data-a="gateno">${tr(L('Chưa đủ tuổi','I am under 18'))}</button></div>
   <div class="row" style="justify-content:center;margin-top:12px">${langBtn()}</div></div></div>`);
  layerEl().onclick=ev=>{const a=ev.target.closest('[data-a]');if(!a)return;
    if(a.dataset.a==='gateok'){store.set('motdoi_adult','1');U.gate=false;closeModal();render()}
    else if(a.dataset.a==='gateno'){layerEl().querySelector('p').textContent=tr(L('Rất tiếc, game này chỉ dành cho người từ 18 tuổi.','Sorry, this game is only for people 18 and over.'))}
    else if(a.dataset.a==='lang'){lang=lang==='vi'?'en':'vi';store.set('motdoi_lang',lang);showGate()}};
}

/* ---------- input ---------- */
function readForm(){const f=U.form;return{first:f.first.trim()||undefined,last:f.last.trim()||undefined,g:f.g,orient:f.orient,country:f.country,tier:+f.tier,custom:true,
  st:{health:+f.health,happy:+f.happy,smarts:+f.smarts,looks:+f.looks},karma:+f.karma,traits:f.traits.slice(0,2)}}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f&&U.form){U.form[t.dataset.f]=t.value;const v=document.getElementById('v-'+t.dataset.f);if(v)v.textContent=t.value;
  if(t.dataset.f==='country'){const pool=NAMES[CTRY[t.value].pool];U.form.last=pick(pool.l);U.form.first=pick(U.form.g==='m'?pool.m:pool.f);render()}
  if(t.dataset.f==='g'){const pool=NAMES[CTRY[U.form.country].pool];U.form.first=pick(t.value==='m'?pool.m:pool.f);render()}}});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.trait&&U.form){const tl=U.form.traits;if(t.checked){if(tl.length>=2){t.checked=false;toast(L('Chỉ chọn tối đa 2 đặc điểm.','Pick up to 2 traits.'));return}tl.push(t.dataset.trait)}else U.form.traits=tl.filter(x=>x!==t.dataset.trait)}
  else if(t.dataset.f&&U.form&&t.tagName==='SELECT')U.form[t.dataset.f]=t.value});
document.addEventListener('click',e=>{
  if(modalOpen&&e.target.closest('#layer .modal'))return;
  const el=e.target.closest('[data-a]');
  if(!el){return}
  if(el.dataset.a==='closesheet'&&e.target.closest('[data-stop]')&&!e.target.closest('.iconbtn[data-a="closesheet"]'))return;
  const a=el.dataset.a,v=el.dataset.v;
  switch(a){
   case'lang':lang=lang==='vi'?'en':'vi';store.set('motdoi_lang',lang);render();break;
   case'tocreate':U.screen='create';U.form=U.form||defaultForm();layer('');modalOpen=false;render();break;
   case'totitle':U.screen='title';render();break;
   case'continue':U.screen='game';render();break;
   case'mode':U.mode=v;render();break;
   case'randform':{const codes=Object.keys(CTRY),code=pick(codes),pool=NAMES[CTRY[code].pool],g=R()<.5?'m':'f',r=()=>rint(15,95);
     U.form={first:pick(g==='m'?pool.m:pool.f),last:pick(pool.l),g,orient:U.form.orient,country:code,tier:rint(0,3),health:r(),happy:r(),smarts:r(),looks:r(),karma:r(),traits:[pick(Object.keys(TRAITS))]};render();break}
   case'destiny':{const codes=Object.keys(CTRY),code=wpick(codes,k=>CTRY[k].b),g=R()<.5?'m':'f',tier=tierFor(cf(code));
     startLife({country:code,g,orient:U.form?U.form.orient:'straight',tier,traits:R()<.5?[pick(Object.keys(TRAITS))]:[]});break}
   case'free':startLife(readForm());break;
   case'age':ageUp();break;
   case'sheet':U.sheet=v;layer(renderSheet());break;
   case'closesheet':U.sheet=null;layer('');break;
   case'menu':U.sheet='menu';layer(renderSheet());break;
   case'newlife':store.del(KEY);S=null;U.sheet=null;U.screen='create';layer('');render();break;
   case'birthcard':U.sheet=null;showBirthCard();break;
   case'act':doAct(v);break;
   case'person':U.sheet='person:'+v;layer(renderSheet());break;
   case'pact':{const[id,k]=v.split('|');doPerson(id,k);break}
   case'career':careerAct(v);break;
   case'apply':applyJob(v);break;
   case'inv':{const[id,h]=v.split('|');invest(id,h);break}
   case'money':{const[k,x]=v.split('|');moneyAct(k,x);break}
   case'heir':continueAsChild(v);break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&U.sheet&&!modalOpen){U.sheet=null;layer('')}});

/* ---------- boot ---------- */
function start(data){
  if(data&&data.S){S=data.S;if(data.U)Object.assign(U,data.U)}
  else{try{const s=store.get(KEY);S=s?JSON.parse(s):null}catch(e){S=null}}
  if(S&&S.p&&!S.p.alive&&U.screen==='game')U.screen='death';
  U.gate=store.get('motdoi_adult')!=='1';
  render();
}
window.claude?.hot?.snapshot?.(()=>({S,U:{screen:U.screen,mode:U.mode,form:U.form}}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
